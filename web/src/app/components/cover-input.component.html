<label class="block font-bold text-white" for="cover-file">Cover image</label>
<input id="cover-file" class="mt-2 block w-full text-slate-200" type="file" accept="image/*" (change)="select($event)" />
<button class="mt-3 border-2 border-white px-3 py-2 font-bold text-white transition hover:bg-white hover:text-black" type="button" (click)="readFromClipboard()">
  ดึงรูปจาก Clipboard
</button>
@if (preview()) { <img class="cover-preview mt-3" [src]="preview()" alt="Cover preview" /> }
@if (error()) { <p class="mt-2 text-pink-200" role="alert">{{ error() }}</p> }
