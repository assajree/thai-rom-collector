
<div class="search-console">
  <div class="admin-search-field">
    <span class="admin-search-icon" aria-hidden="true">⌕</span>
    <label for="game-search" class="sr-only">ค้นหาเกม</label>
    <input #searchInput id="game-search" class="admin-search-input" type="search" placeholder="ค้นหาเกม..." [(ngModel)]="draft.keyword" (ngModelChange)="emit()" />
    @if (draft.keyword) {
      <button type="button" class="search-clear-btn" (click)="clearKeyword()" aria-label="ล้างข้อความค้นหา" title="ล้างข้อความค้นหา">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    }
  </div>
</div>

<button type="button" class="sort-toggle" [attr.aria-expanded]="sortOpen" aria-controls="game-sort-row" (click)="sortOpen = !sortOpen">ตัวกรอง</button>

<div id="game-sort-row" class="sort-row" [class.sort-row--open]="sortOpen">
   @if (routeKind !== 'translator') {
    <div class="sort-field">
      <label for="filter-translator">ทีมแปล</label>
      <select class="app-select" id="filter-translator" [(ngModel)]="draft.translatorId" (ngModelChange)="emit()"><option [ngValue]="null">ทุกทีม</option>@for (translator of translators; track translator.id) { <option [ngValue]="translator.id">{{ translator.name }}</option> }</select>
    </div>
  }
  @if (routeKind !== 'system') {
    <div class="sort-field">
      <label for="filter-system">เครื่องเกม</label>
      <select class="app-select" id="filter-system" [(ngModel)]="draft.system" (ngModelChange)="emit()"><option [ngValue]="null">ทุกเครื่อง</option>@for (system of systems; track system) { <option [ngValue]="system">{{ system }}</option> }</select>
    </div>
  } 
  <div class="sort-field sort-field--sort">
    <label for="sort-patches">เรียงตาม</label>
    <select class="app-select" id="sort-patches" [(ngModel)]="draft.sortBy" (ngModelChange)="emit()"><option value="updateDate">วันที่เพิ่ม</option><option value="gameTitle">ชื่อเกม</option><option value="translatedBy">ทีมแปล</option><option value="system">เครื่องเกม</option><option value="playTime">ความยาวเกม</option></select>
    <button type="button" class="button" (click)="draft.sortDirection = draft.sortDirection === 'asc' ? 'desc' : 'asc'; emit()">{{ draft.sortDirection === 'asc' ? 'น้อย → มาก' : 'มาก → น้อย' }}</button>
  </div>
</div>
