<main class="admin-systems-page min-h-full p-4 text-white sm:p-6 lg:p-8">
  <p class="font-bold uppercase tracking-[0.16em] text-signal">Admin area</p>
  <div class="mt-1 flex flex-wrap items-center justify-between gap-3">
    <h1 class="font-black">จัดการ master เครื่องเกม</h1>
    <button class="border-2 border-signal bg-signal px-4 py-2 font-bold text-ink" type="button" (click)="openCreate()">เพิ่มเครื่องเกม</button>
  </div>
  <p class="mt-3 text-slate-200">รายการเครื่องเกมทั้งหมดในระบบ</p>
  <div class="mt-6 overflow-x-auto border border-slate-500">
    <table class="w-full min-w-[36rem] text-left">
      <thead class="bg-[#171d35]"><tr><th class="p-3">ชื่อย่อ</th><th class="p-3">ชื่อเต็ม</th><th class="p-3">จัดการ</th></tr></thead>
      <tbody>@for (system of systems | async; track system.id) { <tr class="border-t border-slate-600"><td class="p-3">{{ system.shortName }}</td><td class="p-3">{{ system.name }}</td><td class="flex gap-2 p-3"><button class="border border-signal px-3 py-1 font-bold text-signal" type="button" (click)="openEdit(system)">แก้ไข</button><button class="border border-arcade px-3 py-1 font-bold text-white" type="button" (click)="remove(system)">ลบ</button></td></tr> } @empty { <tr><td class="p-4 text-slate-300" colspan="3">ยังไม่มีข้อมูลเครื่องเกม</td></tr> }</tbody>
    </table>
  </div>
  @if (dialogOpen) { <div class="system-dialog-backdrop" role="presentation"><section class="system-dialog" role="dialog" aria-modal="true" aria-labelledby="systems-dialog-title" (click)="$event.stopPropagation()"><h2 id="systems-dialog-title" class="font-black">{{ editingId ? 'แก้ไขเครื่องเกม' : 'เพิ่มเครื่องเกม' }}</h2><label class="mt-4 block">ชื่อย่อเครื่องเกม<input class="admin-input" [(ngModel)]="shortName" /></label><label class="mt-3 block">ชื่อเต็มเครื่องเกม<input class="admin-input" [(ngModel)]="name" /></label><div class="mt-5 flex gap-2"><button class="border border-signal bg-signal px-3 py-2 font-bold text-ink" type="button" (click)="save()">บันทึก</button><button class="border border-slate-300 px-3 py-2 font-bold text-slate-100" type="button" (click)="closeDialog()">ยกเลิก</button></div></section></div> }
  <button class="mt-6 border border-slate-300 px-4 py-2 font-bold text-slate-100" type="button" (click)="signOut()">ออกจากระบบ</button>
</main>
