<main class="min-h-full p-4 text-white sm:p-6 lg:p-8">
  <p class="text-xs font-bold uppercase tracking-[0.16em] text-[#c7ff3a]">Admin area</p>
  <h1 class="mt-1 text-2xl font-black">{{ editId ? 'แก้ไขแพตช์เกม' : 'เพิ่มแพตช์เกม' }}</h1>
  <p class="mt-3 text-sm text-slate-200">เพิ่มข้อมูลแพตช์เกมและรูปปก</p>
  <form class="mt-8 grid max-w-2xl gap-4" [formGroup]="form" (ngSubmit)="save()">
    <label>ชื่อไฟล์<input class="admin-input" formControlName="fileName" /></label>
    <label>ชื่อเกม<input class="admin-input" formControlName="gameTitle" /></label>
    <label>เครื่องเกม<input class="admin-input" formControlName="system" /></label>
    <label>ทีมแปล<select class="admin-input" formControlName="translatorId"><option value="">เลือกทีมแปล</option>@for (translator of translators | async; track translator.id) { <option [value]="translator.id">{{ translator.name }}</option> }</select></label>
    <div class="border-t border-slate-600 pt-4"><label>สร้างทีมแปลใหม่<input class="admin-input" [value]="newTranslatorName" (input)="newTranslatorName = $any($event.target).value" /></label><label class="mt-2 block">ลิงก์ทีมแปล (ถ้ามี)<input class="admin-input" [value]="newTranslatorLink" (input)="newTranslatorLink = $any($event.target).value" /></label><button class="mt-2 border border-signal px-3 py-2 text-sm font-bold text-signal hover:bg-signal hover:text-ink" type="button" (click)="createTranslator()">เพิ่มทีมแปล</button></div>
    <label>Patch tool<input class="admin-input" formControlName="patchTool" /></label>
    <fieldset class="border border-slate-600 p-3"><legend>หมวดหมู่</legend>@for (tag of tags | async; track tag.id) { <label class="mr-3 inline-flex gap-1 text-sm"><input type="checkbox" [checked]="selectedTags.includes(tag.name)" (change)="toggleTag(tag.name)">{{ tag.name }}</label> }<div class="mt-3"><input class="admin-input" placeholder="สร้าง tag ใหม่" [value]="newTagName" (input)="newTagName = $any($event.target).value"><button class="mt-2 border border-signal px-3 py-2 text-sm font-bold text-signal" type="button" (click)="createTag()">เพิ่ม tag</button></div></fieldset>
    <label>Patch file URL<input class="admin-input" formControlName="patchFileUrl" type="url" /></label>
    <app-cover-input (selected)="cover = $event" />
    <button class="w-fit border-2 border-signal bg-signal px-5 py-3 font-bold text-ink disabled:opacity-50" type="submit" [disabled]="form.invalid">บันทึกแพตช์</button>
  </form>
  <button class="mt-6 border border-slate-300 px-4 py-2 text-sm font-bold text-slate-100 hover:border-signal hover:text-signal" type="button" (click)="signOut()">ออกจากระบบ</button>
</main>
