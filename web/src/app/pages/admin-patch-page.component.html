<main class="min-h-full p-4 text-white sm:p-6 lg:p-8">
  <h1 class="mt-1 font-black">{{ editId ? 'แก้ไขแพตช์เกม' : 'เพิ่มแพตช์เกม' }}</h1>
  <form class="mt-8 grid max-w-2xl gap-4" [formGroup]="form" (ngSubmit)="save()">
    <label class="required">ชื่อเกม<input class="admin-input" formControlName="gameTitle" /></label>
    <div>
      <label class="required">เครื่องเกม<select class="admin-input" formControlName="system">
          <option value="">เลือกเครื่องเกม</option>@for (system of systems | async; track system.id) { <option
            [value]="system.shortName">{{ system.shortName }} — {{ system.name }}</option> }
        </select></label>
      <button class="mt-2 border border-signal px-3 py-2 font-bold text-signal hover:bg-signal hover:text-ink"
        type="button" (click)="openSystemDialog()">เพิ่มเครื่องเกม</button>
    </div>
    <div>
      <label class="required">ทีมแปล<select class="admin-input" formControlName="translatorId">
          <option value="">เลือกทีมแปล</option>@for (translator of translatorOptions; track translator.id) { <option
            [value]="translator.id">{{ translator.shortName }} — {{ translator.name }}</option> }
        </select></label>
      <button class="mt-2 border border-signal px-3 py-2 font-bold text-signal hover:bg-signal hover:text-ink"
        type="button" (click)="openTranslatorDialog()">เพิ่มทีมแปล</button>
    </div>
    <div>
      <label>ภาพปก</label>
      <app-cover-input class="block" [gameTitle]="form.controls.gameTitle.value" (selected)="cover = $event" />
    </div>
    <label>Patch tool<input class="admin-input" formControlName="patchTool" /></label>
    <label>Patch file URL<input class="admin-input" formControlName="patchFileUrl" type="url" /></label>
    <label class="inline-flex items-center gap-2"><input formControlName="haveRom" type="checkbox" /> มี ROM</label>
    <label>Patched ROM URL<input class="admin-input" formControlName="patchedRomUrl" type="url" /></label>
    <label>ข้อความอ้างอิง<textarea class="admin-input" formControlName="referenceText" rows="3"></textarea></label>
    <label>Reference URL<input class="admin-input" formControlName="referenceUrl" type="url" /></label>
    <fieldset class="border border-slate-600 p-3">
      <legend>หมวดหมู่</legend>@for (tag of tags | async; track tag.id) { <label class="mr-3 inline-flex gap-1"><input
          type="checkbox" [checked]="selectedTags.includes(tag.name)" (change)="toggleTag(tag.name)">{{ tag.name
        }}</label> }<div class="mt-3"><input class="admin-input" placeholder="สร้าง tag ใหม่" [value]="newTagName"
          (input)="newTagName = $any($event.target).value"><button
          class="mt-2 border border-signal px-3 py-2 font-bold text-signal" type="button" (click)="createTag()">เพิ่ม
          tag</button></div>
    </fieldset>

    <label>ชื่อไฟล์<input class="admin-input" formControlName="fileName" readonly /></label>
    <label>วันที่อัปเดต<input class="admin-input" formControlName="updateDate" type="date" /></label>
    <button class="w-fit border-2 border-signal bg-signal px-5 py-3 font-bold text-ink disabled:opacity-50"
      type="submit" [disabled]="form.invalid">บันทึกแพตช์</button>
  </form>
  @if (systemDialogOpen) {
  <div class="system-dialog-backdrop" role="presentation" (click)="closeSystemDialog()">
    <section class="system-dialog" role="dialog" aria-modal="true" aria-labelledby="system-dialog-title"
      (click)="$event.stopPropagation()">
      <h2 id="system-dialog-title" class="font-black">เพิ่มเครื่องเกม</h2>
      <label class="mt-4 block">ชื่อย่อเครื่องเกม<input class="admin-input" [value]="newSystemShortName"
          (input)="newSystemShortName = $any($event.target).value" /></label>
      <label class="mt-3 block">ชื่อเต็มเครื่องเกม<input class="admin-input" [value]="newSystemName"
          (input)="newSystemName = $any($event.target).value" /></label>
      <div class="mt-5 flex gap-2">
        <button class="border border-signal bg-signal px-3 py-2 font-bold text-ink" type="button"
          (click)="createSystem()">บันทึก</button>
        <button class="border border-slate-300 px-3 py-2 font-bold text-slate-100" type="button"
          (click)="closeSystemDialog()">ยกเลิก</button>
      </div>
    </section>
  </div>
  }
  @if (translatorDialogOpen) {
  <div class="system-dialog-backdrop" role="presentation" (click)="closeTranslatorDialog()">
    <section class="system-dialog" role="dialog" aria-modal="true" aria-labelledby="translator-dialog-title"
      (click)="$event.stopPropagation()">
      <h2 id="translator-dialog-title" class="font-black">เพิ่มทีมแปล</h2>
      <label class="mt-4 block">ชื่อย่อทีมแปล<input class="admin-input" [value]="newTranslatorShortName"
          (input)="newTranslatorShortName = $any($event.target).value" /></label>
      <label class="mt-3 block">ชื่อเต็มทีมแปล<input class="admin-input" [value]="newTranslatorName"
          (input)="newTranslatorName = $any($event.target).value" /></label>
      <label class="mt-3 block">Mod tool<input class="admin-input" [value]="newTranslatorModTool"
          (input)="newTranslatorModTool = $any($event.target).value" /></label>
      <label class="mt-3 block">ลิงก์ทีมแปล (ถ้ามี)<input class="admin-input" [value]="newTranslatorLink"
          (input)="newTranslatorLink = $any($event.target).value" /></label>
      <div class="mt-5 flex gap-2"><button class="border border-signal bg-signal px-3 py-2 font-bold text-ink"
          type="button" (click)="createTranslator()">บันทึก</button><button
          class="border border-slate-300 px-3 py-2 font-bold text-slate-100" type="button"
          (click)="closeTranslatorDialog()">ยกเลิก</button></div>
    </section>
  </div>
  }
</main>
