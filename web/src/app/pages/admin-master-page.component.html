<main class="admin-master-page min-h-full p-4 text-white sm:p-6 lg:p-8">
  <p class="font-bold uppercase tracking-[0.16em] text-signal">Admin area</p>
  <div class="mt-1 flex flex-wrap items-center justify-between gap-3"><h1 class="font-black">{{ title }}</h1><button class="border-2 border-signal bg-signal px-4 py-2 font-bold text-ink" type="button" (click)="create.emit()">{{ addLabel }}</button></div>
  @if (description) { <p class="mt-3 text-slate-200">{{ description }}</p> }
  @if (items.length) { <section class="master-card-grid mt-6" aria-label="รายการข้อมูล">@for (item of items; track item.id) { <article class="master-card">@if (cardTemplate) { <ng-container *ngTemplateOutlet="cardTemplate; context: { $implicit: item }" />}<div class="master-card-actions"><button class="border border-signal px-3 py-1 font-bold text-signal" type="button" (click)="edit.emit(item)">แก้ไข</button><button class="border border-arcade px-3 py-1 font-bold text-white" type="button" (click)="remove.emit(item)">ลบ</button></div></article>}</section> } @else { <p class="mt-6 border border-slate-500 p-4 text-slate-300">{{ emptyText }}</p> }
  @if (dialogOpen) { <div class="master-dialog-backdrop" role="presentation"><section class="master-dialog" role="dialog" aria-modal="true" aria-labelledby="master-dialog-title" (click)="$event.stopPropagation()"><h2 id="master-dialog-title" class="font-black">{{ dialogTitle }}</h2>@if (editorTemplate) { <ng-container *ngTemplateOutlet="editorTemplate" />}<div class="mt-5 flex justify-between gap-2"><button class="border border-signal bg-signal px-3 py-2 font-bold text-ink" type="button" [disabled]="saving" (click)="save.emit()">บันทึก</button><button class="border border-slate-300 px-3 py-2 font-bold text-slate-100" type="button" (click)="close.emit()">ยกเลิก</button></div></section></div> }
</main>
