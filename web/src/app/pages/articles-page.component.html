<main class="articles-page"><p class="eyebrow">Knowledge base</p><h1>บทความ</h1><p class="description">ความรู้เกี่ยวกับเกม แพตช์ และการใช้งาน ROM</p><p *ngIf="loading">กำลังโหลดบทความ...</p><section class="article-grid"><article class="article-card" *ngFor="let article of articles"><img *ngIf="article.coverUrl" [src]="article.coverUrl" [alt]="article.title"><p class="article-meta">{{article.category}} · {{article.publishedAt | date:'d MMM yyyy'}}</p><h2>{{article.title}}</h2><p>{{article.excerpt}}</p><a [routerLink]="['/article', article.slug]">อ่านบทความ →</a></article></section><p *ngIf="!loading && !articles.length">ยังไม่มีบทความ</p></main>
