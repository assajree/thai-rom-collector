<main class="admin-articles article-container">
    <header class="page-heading">
        <div>
            <p class="eyebrow">CONTENT WORKSPACE</p>
            <h1>จัดการบทความ</h1>
        </div><button *ngIf="!isEdit" class="primary-button" type="button" (click)="start()">+ เพิ่มบทความ</button>
    </header>
    <section *ngIf="!isEdit" class="list-mode">
        <div class="section-heading">
            <div>
                <h2>บทความทั้งหมด</h2>
                <p>{{ items.length }} รายการ</p>
            </div>
        </div>
        <div class="article-list">
            <article *ngFor="let item of items" class="article-row">
                <div class="article-row-main">
                    <span class="status" [class.published]="item.status === 'published'">
                        {{
                        item.status === 'published' ? 'เผยแพร่แล้ว' : 'ฉบับร่าง' }}
                    </span>
                    <h3>{{ item.title || 'ไม่มีชื่อบทความ' }}</h3>
                </div>
                <div class="row-actions">
                    <button type="button" [disabled]="busy"
                        (click)="item.status === 'published' ? unpublish(item) : publish(item)">
                        {{ item.status === 'published' ? 'Unpublish' : 'Publish' }}
                    </button>
                    <button type="button" (click)="start(item)">Edit</button>
                    <button type="button" (click)="openPreview(item)">Preview</button>
                    <button class="danger" type="button" [disabled]="busy" (click)="remove(item)">ลบ</button>
                </div>
            </article>
            <p *ngIf="!items.length" class="empty-state">ยังไม่มีบทความ เริ่มจากการเพิ่มบทความแรก</p>
        </div>
    </section>
    <section *ngIf="isEdit && !isPreview" class="workspace-mode">
        <div class="mode-toolbar">
            <button type="button" (click)="backToList()">รายการบทความ</button>
            <h2>{{ editing ? 'แก้ไขบทความ' : 'เพิ่มบทความ' }}</h2>
            <button type="button" (click)="togglePreview(true)">Preview</button>
        </div>
        <div class="editor-layout">
            <form class="editor-form" (submit)="$event.preventDefault(); save('draft')">
                <label>
                    ชื่อบทความ
                    <input name="title" [(ngModel)]="form.title" (blur)="slugify()" placeholder="ชื่อบทความ">
                </label>

                <label>
                    เนื้อหา Markdown
                    <textarea name="content" [(ngModel)]="form.content" rows="18"
                        placeholder="# หัวข้อบทความ"></textarea>
                </label>

                <label>
                    Slug
                    <input name="slug" [(ngModel)]="form.slug" placeholder="how-to-patch">
                </label>
                <div class="field-grid">
                    <label>
                        หมวดหมู่
                        <input name="category" [(ngModel)]="form.category">
                    </label>
                    <label>
                        รูปปก URL
                        <input name="coverUrl" [(ngModel)]="form.coverUrl">
                    </label>
                </div>
                <label>
                    คำโปรย
                    <textarea name="excerpt" [(ngModel)]="form.excerpt" rows="3"></textarea>
                </label>

                <div class="form-actions">
                    <button class="primary-button" type="submit" [disabled]="busy">บันทึก</button>
                </div>
            </form>
        </div>
    </section>
    <section *ngIf="isEdit && isPreview" class="preview-mode">
        <div class="mode-toolbar">
            <button type="button" (click)="backToList()">รายการบทความ</button>
            <h2>Preview บทความ</h2>
            <button type="button" (click)="togglePreview(false)">แก้ไขบทความ</button>
        </div>
        <app-article-preview [article]="form" />
        <div class="form-actions preview-actions">
            <button class="primary-button" type="button" [disabled]="busy" (click)="save()">บันทึก</button>
        </div>
    </section>
</main>
