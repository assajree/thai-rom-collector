<main class="admin-articles"><h1>จัดการบทความ</h1><button type="button" (click)="start()">+ เขียนบทความใหม่</button><section class="editor"><input name="title" [(ngModel)]="form.title" (blur)="slugify()" placeholder="ชื่อบทความ"><input name="slug" [(ngModel)]="form.slug" placeholder="slug เช่น how-to-patch"><input name="category" [(ngModel)]="form.category" placeholder="หมวดหมู่"><input name="coverUrl" [(ngModel)]="form.coverUrl" placeholder="URL รูปปก (ถ้ามี)"><textarea name="excerpt" [(ngModel)]="form.excerpt" placeholder="สรุปบทความสั้น ๆ"></textarea><textarea name="content" [(ngModel)]="form.content" rows="16" placeholder="# หัวข้อบทความ&#10;&#10;เขียนด้วย Markdown"></textarea><button type="button" (click)="preview=!preview">{{preview?'ซ่อน Preview':'แสดง Preview'}}</button><div *ngIf="preview" class="preview" [innerHTML]="rendered()"></div><button type="button" [disabled]="busy" (click)="save('draft')">บันทึกร่าง</button><button type="button" [disabled]="busy" (click)="save('published')">เผยแพร่</button></section><section class="admin-list"><article *ngFor="let item of items"><strong>{{item.title}}</strong><span>{{item.status}}</span><button type="button" (click)="start(item)">แก้ไข</button><button type="button" [disabled]="busy" (click)="remove(item)">ลบ</button></article></section></main>
