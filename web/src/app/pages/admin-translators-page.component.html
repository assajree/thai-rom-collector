<main class="min-h-full p-4 text-white sm:p-6 lg:p-8"><p class="font-bold uppercase tracking-[0.16em] text-signal">Admin area</p><div class="mt-1 flex flex-wrap items-center justify-between gap-3"><h1 class="font-black">จัดการ master ทีมแปล</h1><button class="border-2 border-signal bg-signal px-4 py-2 font-bold text-ink" (click)="add()">เพิ่มทีมแปล</button></div><div class="mt-6 overflow-x-auto border border-slate-500"><table class="w-full min-w-[40rem] text-left"><thead class="bg-[#171d35]"><tr><th class="p-3">ชื่อย่อ</th><th class="p-3">ชื่อเต็ม</th><th class="p-3">ลิงก์</th><th class="p-3">จัดการ</th></tr></thead><tbody>@for(x of items | async;track x.id){<tr class="border-t border-slate-600"><td class="p-3">{{x.shortName}}</td><td class="p-3">{{x.name}}</td><td class="p-3">{{x.link||'—'}}</td><td class="flex gap-2 p-3"><button class="border border-signal px-3 py-1 text-signal" (click)="edit(x)">แก้ไข</button><button class="border border-arcade px-3 py-1 text-white" (click)="remove(x)">ลบ</button></td></tr>}@empty{<tr><td class="p-4" colspan="4">ยังไม่มีข้อมูลทีมแปล</td></tr>}</tbody></table></div>@if(open){<div class="system-dialog-backdrop" (click)="close()"><section class="system-dialog" role="dialog" aria-modal="true" (click)="$event.stopPropagation()"><h2 class="font-black">{{id?'แก้ไขทีมแปล':'เพิ่มทีมแปล'}}</h2><label class="mt-4 block">ชื่อย่อ<input class="admin-input" [(ngModel)]="shortName"></label><label class="mt-3 block">ชื่อเต็ม<input class="admin-input" [(ngModel)]="name"></label><label class="mt-3 block">ลิงก์ (ถ้ามี)<input class="admin-input" [(ngModel)]="link" type="url"></label><div class="mt-5 flex gap-2"><button class="border border-signal bg-signal px-3 py-2 font-bold text-ink" (click)="save()">บันทึก</button><button class="border border-slate-300 px-3 py-2 text-white" (click)="close()">ยกเลิก</button></div></section></div>}<button class="mt-6 border border-slate-300 px-4 py-2 text-white" (click)="signOut()">ออกจากระบบ</button></main>
