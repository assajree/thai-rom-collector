<main class="flex min-h-[70vh] items-center justify-center p-6 text-center">
  <div>
    <p class="font-bold uppercase tracking-[0.16em] ">Admin access</p>
    <h1 class="mt-2 ">เข้าสู่ระบบผู้ดูแล</h1>
    @if (auth.user()) {
      <p class="mt-3 text-slate-300">เข้าสู่ระบบแล้วด้วยบัญชี {{ auth.user()?.email }}</p>
      <button class="mt-6   bg-signal px-5 py-3 font-bold text-ink " type="button" (click)="signOut()">Logout</button>
    } @else {
      <p class="mt-3 text-slate-300">ใช้บัญชี Google ที่ได้รับอนุญาตเพื่อจัดการแพตช์</p>
      <button class="mt-6   bg-signal px-5 py-3 font-bold text-ink " type="button" (click)="signIn()">Login with Google</button>
    }
  </div>
</main>
