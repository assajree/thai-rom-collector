<app-admin-master-page [items]="(items | async) ?? []" title="จัดการลิงก์ sidebar" description="ลิงก์ไปยังหน้า /other ของบทความ" addLabel="เพิ่มลิงก์" emptyText="ยังไม่มีลิงก์ sidebar" [dialogOpen]="open" [dialogTitle]="id ? 'แก้ไขลิงก์ sidebar' : 'เพิ่มลิงก์ sidebar'" [saving]="saving" (create)="add()" (edit)="edit($event)" (remove)="remove($event)" (save)="save()" (close)="close()" (signOut)="signOut()">
  <ng-template #card let-item><h2 class="font-black text-lg">{{ item.label }}</h2><p class="mt-1 text-sm text-slate-300">{{ item.type === 'external' ? item.url : '/other/' + item.articleSlug }} - {{ sectionLabel(item.section) }}</p></ng-template>
  <ng-template #editor><label class="mt-4 block">ข้อความลิงก์<input class="admin-input" [(ngModel)]="label" /></label><label class="mt-3 block">ชนิดลิงก์<select class="admin-input" [(ngModel)]="type"><option *ngFor="let item of typeOptions" [value]="item.value">{{ item.label }}</option></select></label>@if (type === 'article') { <label class="mt-3 block">บทความปลายทาง<select class="admin-input" [(ngModel)]="articleSlug"><option value="">เลือกบทความ</option><option *ngFor="let article of (articleItems | async)" [value]="article.slug">{{ article.title }} ({{ article.slug }})</option></select></label> } @if (type === 'external') { <label class="mt-3 block">URL ภายนอก<input class="admin-input" type="url" [(ngModel)]="url" placeholder="https://example.com" /></label> }<label class="mt-3 block">Section<select class="admin-input" [(ngModel)]="section"><option *ngFor="let item of sectionOptions" [value]="item.value">{{ item.label }}</option></select></label></ng-template>
</app-admin-master-page>
