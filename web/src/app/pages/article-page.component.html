<main class="article-page"><a routerLink="/articles">← บทความทั้งหมด</a><p *ngIf="loading">กำลังโหลด...</p><ng-container *ngIf="!loading && article; else missing"><img *ngIf="article.coverUrl" class="article-cover" [src]="article.coverUrl" [alt]="article.title"><p class="article-meta">{{article.category}} · {{article.publishedAt | date:'d MMM yyyy'}}</p><h1>{{article.title}}</h1><p class="excerpt">{{article.excerpt}}</p><div class="markdown-body" [innerHTML]="html"></div></ng-container><ng-template #missing><p *ngIf="!loading">ไม่พบบทความนี้</p></ng-template></main>
