<header class="flex min-h-16 items-center justify-between border-b-2 border-slate-400 bg-black px-4 lg:hidden">
  <a class="text-sm font-bold uppercase tracking-[0.16em] text-white no-underline" routerLink="/">Thai Patch DB</a>
  <a class="text-xs font-bold uppercase tracking-wider text-signal no-underline" routerLink="/admin">Admin</a>
</header>

<div class="min-h-screen lg:grid lg:grid-cols-[8.5rem_minmax(0,1fr)]">
  <aside class="retro-rail hidden border-r-4 border-slate-300 bg-black px-2 py-4 lg:flex lg:flex-col" aria-label="Game system selection">
    <a class="mb-7 block border-b border-slate-700 pb-3 text-center text-[0.68rem] font-bold uppercase tracking-[0.16em] text-slate-100 no-underline" routerLink="/">
      Thai Patch<br><span class="text-signal">Archive</span>
    </a>

    <nav class="space-y-3" aria-label="Main navigation">
      <a class="retro-rail-link" routerLink="/" routerLinkActive="retro-rail-link--active" [routerLinkActiveOptions]="{ exact: true }">Browse</a>
      <a class="retro-rail-link" routerLink="/add-patch" routerLinkActive="retro-rail-link--active">Add patch</a>
    </nav>

    <div class="mt-8 border-t border-slate-700 pt-4">
      <p class="mb-3 text-center text-[0.57rem] font-bold uppercase tracking-[0.12em] text-slate-400">Game system</p>
      <div class="space-y-1">
        @for (platform of platforms; track platform) {
          <button
            class="retro-system-button"
            [class.retro-system-button--active]="selectedPlatform() === platform"
            type="button"
            (click)="selectPlatform(platform)">
            {{ platform }}
          </button>
        }
      </div>
    </div>

    <p class="mt-auto pt-8 text-center text-[0.56rem] leading-4 text-slate-600">TH / GAME<br>PATCH DATABASE</p>
  </aside>

  <section class="min-w-0 bg-[#343568]">
    @if (statusMessage(); as message) {
      <div class="flex items-center gap-2 border-b border-black bg-signal px-4 py-2 text-sm font-bold text-ink sm:px-6" [class.bg-arcade]="message.tone === 'error'" [class.text-white]="message.tone === 'error'" role="status" aria-live="polite">
        <span class="grid h-5 w-5 place-items-center rounded-full border border-current" aria-hidden="true">{{ message.tone === 'error' ? '!' : 'i' }}</span>
        {{ message.text }}
        <button class="ml-auto text-xl leading-none" type="button" (click)="statusMessageService.clear()" aria-label="Dismiss message">×</button>
      </div>
    }

    <router-outlet />
  </section>
</div>
